        const storyData = [
            { text: &quot;One day, I find a map. It's time to find a treasure!&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/UxgAWrbfDeiKaj8PpU55SA.mp3&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/wig4G9htReZ4FjPiQq5btD.jpg&quot; },
            { text: &quot;I look at the old store in my backyard. I need everything to be ready.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/UsTYHGbjxDsSn9VSLpqdvh.mp3&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/WFPjTZkBrRnet5krSZjbj9.jpg&quot; },
            { text: &quot;Mom says, You will need a little help. I find a seed of an idea.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/dVhbuGnjGXTq4nKURdpnfM.mp3&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/yDPsT3hMcbdCZ7byp96zo3.jpg&quot; },
            { text: &quot;Dad says, We will buy many tools for our team. We go to Mr. Pinky's store.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/zqUAqxKVRC9amjCadqKdMa.mp3&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/neyYxvMxQ7Ea9PjZRAxke4.jpg&quot; },
            { text: &quot;Dad rents a plow to find the treasure box under the grass.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/NiDtuN4SP2AjpTg2SKisB3.mp3&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/neyYxvMxQ7Ea9PjZRAxke4.jpg&quot; },
            { text: &quot;We pick up stone and clump of dirt. This is not fun, it is hard work!&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/LdZGRoUpQSHwa2mkGv8HdR.mp3&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/neyYxvMxQ7Ea9PjZRAxke4.jpg&quot; },
            { text: &quot;I am tired, and I need cool water. We finish at the tree.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/GFcRyYZXBqDCnUr6n4587a.mp3&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/neyYxvMxQ7Ea9PjZRAxke4.jpg&quot; },
            { text: &quot;At school, I learn about old things. We find a compost heap near the garden.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/P3AqjydDNAz8TDWxnqasyF.mp3&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/yDPsT3hMcbdCZ7byp96zo3.jpg&quot; },
            { text: &quot;Also, we must water and weed the path to protect our secret.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/MMNRH5Rvdp6WC6tBzn8mhV.mp3&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/wig4G9htReZ4FjPiQq5btD.jpg&quot; },
            { text: &quot;We wait and wait for a sign. We buy worms to show us the way in the dirt.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/jdgV9xxR9w84MkGFdsy4tc.mp3&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/wvkGMVPUTRngsqrEtaUPuW.jpg&quot; },
            { text: &quot;We take turns with the hose to clean the box. I take pictures of my secret treasure.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/BVynG87brLGDnNLMXMecyX.mp3&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/wvkGMVPUTRngsqrEtaUPuW.jpg&quot; },
            { text: &quot;At night, a deer comes to see our box. Blue barks to protect the treasure.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/unMCjXHVkD2kvpcQWy7pCH.mp3&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/EaNcGNAuHgwFWCaWJCvmPj.jpg&quot; },
            { text: &quot;Dad says, Blue will protect our find. I say, Now we can rest.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/67u6dnJQDEN2C6ay3hkCgT.mp3&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/EaNcGNAuHgwFWCaWJCvmPj.jpg&quot; },
            { text: &quot;Finally, I open the box. It has yellow, orange, and red toys! I have a great surprise!&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/qArtz9jfQRcSrAZ5AipjGX.mp3&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/HQMVJ27zshMKwQpTFcs64L.jpg&quot; },
            { text: &quot;Mom says, Finding this was fun. It is not a garden, but it is better.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/XKQHFd6vecCDe5SzWn9rQo.mp3&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/HQMVJ27zshMKwQpTFcs64L.jpg&quot; },
            { text: &quot;We have a great dinner to celebrate. I love my secret adventure.&quot;, audio: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/audio/p2bg3fQG3EfC7L4YK7iTMe.mp3&quot;, img: &quot;https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/hnZfiSomVfDJtNagHNBRiT.jpg&quot; }
        ];

        let currentPage = 0;

        function initVocab() {
            const grid = document.getElementById('vocab-grid');
            vocabData.forEach((item, index) =&gt; {
                const card = document.createElement('div');
                card.className = 'h-48 perspective';
                card.innerHTML = `
                    &lt;div class=&quot;card-inner w-full h-full relative shadow-md rounded-xl&quot; onclick=&quot;flipCard(this, '${item.audio}')&quot;&gt;
                        &lt;div class=&quot;card-front bg-white flex flex-col items-center justify-center p-4 rounded-xl border-2 border-indigo-100&quot;&gt;
                            &lt;span class=&quot;text-xl font-bold text-indigo-800&quot;&gt;${item.en}&lt;/span&gt;
                            &lt;span class=&quot;mt-2 text-gray-400 text-sm&quot;&gt;Click to flip&lt;/span&gt;
                        &lt;/div&gt;
                        &lt;div class=&quot;card-back bg-indigo-50 flex flex-col items-center justify-center p-4 rounded-xl border-2 border-indigo-600&quot;&gt;
                            &lt;img src=&quot;${item.img}&quot; class=&quot;w-20 h-20 object-contain mb-2 rounded&quot;&gt;
                            &lt;span class=&quot;text-lg font-bold text-indigo-900&quot;&gt;${item.zh}&lt;/span&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                `;
                grid.appendChild(card);
            });
        }

        function flipCard(el, audioUrl) {
            el.classList.toggle('is-flipped');
            if (el.classList.contains('is-flipped')) {
                playAudio(audioUrl);
            }
        }

        function playAudio(url) {
            const audio = new Audio(url);
            audio.play();
        }

        function showPage(pageId) {
            document.querySelectorAll('.page-content').forEach(p =&gt; p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b =&gt; b.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.getElementById('tab-' + pageId).classList.add('active');
        }

        function renderStoryPage() {
            const container = document.getElementById('story-container');
            const page = storyData[currentPage];
            
            let highlightedText = page.text;
            vocabData.sort((a,b) =&gt; b.en.length - a.en.length).forEach(v =&gt; {
                const regex = new RegExp(`\\b${v.en}\\b`, 'gi');
                highlightedText = highlightedText.replace(regex, `&lt;span class=&quot;highlight&quot; onclick=&quot;event.stopPropagation(); playAudio('${v.audio}')&quot;&gt;$&amp;&lt;/span&gt;`);
            });

            container.innerHTML = `
                &lt;div class=&quot;story-img-container&quot;&gt;
                    &lt;img src=&quot;${page.img}&quot; class=&quot;story-img&quot; alt=&quot;Story Illustration&quot;&gt;
                &lt;/div&gt;
                &lt;div class=&quot;bg-white p-4 md:p-6 rounded-xl shadow-lg max-w-2xl w-full flex items-center space-x-4 md:space-x-6&quot;&gt;
                    &lt;button onclick=&quot;playAudio('${page.audio}')&quot; class=&quot;bg-indigo-100 p-3 md:p-4 rounded-full hover:bg-indigo-200 transition flex-shrink-0&quot;&gt;
                        &lt;svg class=&quot;w-6 h-6 md:w-8 md:h-8 text-indigo-700&quot; fill=&quot;currentColor&quot; viewBox=&quot;0 0 20 20&quot;&gt;&lt;path d=&quot;M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.978 5.978 0 0115 10a5.978 5.978 0 01-1.414 4.243 1 1 0 01-1.415-1.415A3.979 3.979 0 0013 10a3.979 3.979 0 00-1.172-2.828 1 1 0 010-1.415z&quot;&gt;&lt;/path&gt;&lt;/svg&gt;
                    &lt;/button&gt;
                    &lt;div class=&quot;story-text-box&quot;&gt;
                        &lt;p class=&quot;text-xl md:text-2xl leading-relaxed text-gray-800&quot;&gt;${highlightedText}&lt;/p&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            `;
            document.getElementById('page-indicator').innerText = `Page ${currentPage + 1} / ${storyData.length}`;
        }

        function nextPage() {
            if (currentPage &lt; storyData.length - 1) {
                currentPage++;
                renderStoryPage();
            }
        }

        function prevPage() {
            if (currentPage &gt; 0) {
                currentPage--;
                renderStoryPage();
            }
        }

        window.onload = () =&gt; {
            initVocab();
            renderStoryPage();
        };
    &lt;/script&gt;

  <script>

    function getIsMobile() {
      const width = document.documentElement.clientWidth
      const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|iPad|Windows Phone|Mobile/i.test(navigator.userAgent) || width <= 768
      return isMobile
    }

    // 打开飞象老师官网
    function openFeixiangTeacher(event) {
      const isMobile = getIsMobile()

      // 判断是否为移动端浏览器
      if (isMobile) {
        // 移动端不跳转
        return
      }
      window.open('https://www.feixianglaoshi.com', '_blank')
    }


    // ==================== 埋点相关代码 ====================

    /**
     * 页面停留时长统计
     */
    (function () {
      let startTime = null
      let totalTime = 0
      let reportTimer = null // 防抖定时器

      // 开始计时
      function startTimer() {
        if (!startTime) {
          startTime = Date.now()
          console.log('[埋点] 开始计时')
        }
      }

      // 停止计时并累加时长
      function stopTimer() {
        if (startTime) {
          totalTime += Date.now() - startTime
          startTime = null
          console.log('[埋点] 停止计时，累计时长:', Math.floor(totalTime / 1000), '秒')
        }
      }

      // 检查页面是否真正可见
      function isPageVisible() {
        // 检查 document.hidden
        if (document.hidden) {
          return false
        }

        // 检查 document.visibilityState
        if (document.visibilityState && document.visibilityState !== 'visible') {
          return false
        }

        // 检查窗口是否有焦点
        if (!document.hasFocus()) {
          return false
        }

        return true
      }

      // 上报停留时长（带防抖）
      function reportStayTime(eventType, immediate = false) {
        stopTimer()

        // 清除之前的定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 如果是立即上报（如页面卸载），不使用防抖
        if (immediate) {
          doReport(eventType)
          return
        }

        // 使用防抖，避免短时间内多次上报
        // 100ms 内如果有多个事件触发，只上报最后一次
        reportTimer = setTimeout(function () {
          doReport(eventType)
          reportTimer = null
        }, 100)
      }

      // 实际执行上报
      function doReport(eventType) {
        if (window.frog && totalTime > 0) {
          const serverData = window.__SERVER_DATA__ || {}
          const chatId = serverData.watermarkChatId
          window.frog.add({
            url: '/time/HtmlPage/enter',
            eventId: 42818,
            customExtend: {
              chat_id: chatId,
              use_time: Math.floor(totalTime / 1000), // 转换为秒
            },
            duration: Math.floor(totalTime / 1000), // 转换为秒,
            currentPage: 'HtmlPage',
            eventAction: 'time',
            eventName: 'enter'
          })
          console.log(`[埋点] 页面停留时长上报 (${eventType}):`, Math.floor(totalTime / 1000), '秒')

          // 上报后重置累计时长，为下次统计做准备
          totalTime = 0
        }
      }

      // 清理函数：移除所有事件监听器
      function cleanup() {
        console.log('[埋点] 清理计时器资源')

        // 清除防抖定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 移除事件监听器
        document.removeEventListener('visibilitychange', handleVisibilityChange)
        window.removeEventListener('blur', handleBlur)
        window.removeEventListener('focus', handleFocus)
        window.removeEventListener('beforeunload', handleBeforeUnload)
        window.removeEventListener('pagehide', handlePageHide)

        // 重置变量
        startTime = null
        totalTime = 0
      }

      // 事件处理函数（需要命名以便移除）
      function handleVisibilityChange() {
        if (document.hidden) {
          // 页面不可见，停止计时并上报
          console.log('[埋点] visibilitychange - 页面隐藏')
          reportStayTime('visibilitychange')
        } else {
          // 页面可见，开始新的计时
          console.log('[埋点] visibilitychange - 页面显示，开始新的计时')
          startTimer()
        }
      }

      function handleBlur() {
        // 窗口失去焦点，停止计时并上报
        console.log('[埋点] blur - 窗口失去焦点')
        reportStayTime('blur')
      }

      function handleFocus() {
        // 窗口获得焦点，开始新的计时
        console.log('[埋点] focus - 窗口获得焦点，开始新的计时')
        startTimer()
      }

      function handleBeforeUnload() {
        // 页面卸载前立即上报（不使用防抖）
        console.log('[埋点] beforeunload - 页面即将卸载')
        reportStayTime('beforeunload', true)
        cleanup()
      }

      function handlePageHide() {
        // 页面隐藏时立即上报（iOS Safari 更可靠，不使用防抖）
        console.log('[埋点] pagehide - 页面隐藏')
        reportStayTime('pagehide', true)
      }

      function handleDOMContentLoaded() {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 监听页面可见性变化
      document.addEventListener('visibilitychange', handleVisibilityChange)

      // 监听窗口失去/获得焦点
      window.addEventListener('blur', handleBlur)
      window.addEventListener('focus', handleFocus)

      // 页面加载完成后开始计时
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', handleDOMContentLoaded)
      } else {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 页面卸载时上报
      window.addEventListener('beforeunload', handleBeforeUnload)

      // 兼容性：监听 pagehide 事件（iOS Safari 更可靠）
      window.addEventListener('pagehide', handlePageHide)
    })()

    /**

     */
    function trackLogoClick(event) {
      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}
        const chatId = serverData.watermarkChatId
        console.log('trackHtmlClick', chatId)

        window.frog.add({
          url: '/click/HtmlPage/logo',
          eventId: 42816,
          customExtend: {
            chat_id: chatId,
          },
          currentPage: 'HtmlPage',
          eventAction: 'click',
          eventName: 'logo'
        })

        console.log('[埋点] 点击飞象老师 Logo')
      }
    }

    /**
     * 点击立即体验的埋点
     */
    function trackStartButtonClick(event) {
      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}
        const chatId = serverData.watermarkChatId
        console.log('trackHtmlClick', chatId)
        window.frog.add({
          url: '/click/HtmlPage/start',
          eventId: 42817,
          customExtend: {
            chat_id: chatId
          },
          currentPage: 'HtmlPage',
          eventAction: 'click',
          eventName: 'start'
        })
        console.log('[埋点] 点击立即体验')
      }
    }

    // 绑定点击事件
    document.addEventListener('DOMContentLoaded', function () {
      // 绑定 Logo 点击埋点和跳转功能
      const logoElement = document.querySelector('.left-watermark-content')
      if (logoElement) {
        logoElement.addEventListener('click', function (event) {
          trackLogoClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定立即体验按钮点击埋点和跳转功能
      const startButton = document.querySelector('.jump-button')
      if (startButton) {
        startButton.addEventListener('click', function (event) {
          trackStartButtonClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定水印覆盖层点击（整体区域）
      const watermarkOverlay = document.querySelector('.watermark-overlay')
      if (watermarkOverlay) {
        watermarkOverlay.addEventListener('click', function (event) {
          // 如果点击的不是 logo 或按钮，则触发跳转
          const target = event.target
          const isLogo = target.closest('.left-watermark-content')
          const isButton = target.closest('.jump-button')

          if (!isLogo && !isButton) {
            openFeixiangTeacher(event)
          }
        })
      }
    })

    // ==================== 原有功能代码 ====================

    function adjustRem() {
      const pcBaseWidth = 375 // 设计稿
      const width = document.documentElement.clientWidth
      document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }


    // 移动端检测和按钮隐藏逻辑
    function checkAndHideButtonOnMobile() {
      const isMobile = getIsMobile()
      if (isMobile) {
        adjustRem()
      }
      const jumpButton = document.querySelector('.right-watermark-content .jump-button');
      const iframeContainer = document.querySelector('.iframe-container');

      if (isMobile && jumpButton) {
        jumpButton.style.display = 'none';
      } else {
        jumpButton.style.display = 'flex'
      }

      // 移动端时给iframe-container添加类名，否则移除类名
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }


    function handleResize() {
      // 响应式处理：重新检测移动端并处理按钮显示/隐藏
      checkAndHideButtonOnMobile();

      // 在窗口大小变化时，重新应用移动端相关的逻辑
      const isMobile = getIsMobile()
      const watermarkOverlay = document.querySelector('.watermark-overlay');
      const iframeContainer = document.querySelector('.iframe-container');

      // 根据当前设备类型调整水印覆盖层的点击行为
      if (watermarkOverlay) {
        if (isMobile) {
          // 移动端：移除点击事件或设置为空函数
          watermarkOverlay.onclick = function () {
            // 移动端不执行跳转
            return;
          };
        } else {
          // 桌面端：恢复正常的点击跳转功能
          watermarkOverlay.onclick = openFeixiangTeacher;
        }
      }

      // 确保在resize时也能正确添加或移除mobile类
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    // 防止iframe内容溢出
    window.addEventListener('resize', handleResize);

    // 页面加载完成后执行移动端检测
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    // 清理所有事件绑定的函数
    function clearAllEvents() {
      // 清除 resize 事件监听器
      window.removeEventListener('resize', handleResize);

      // 清除 DOMContentLoaded 事件监听器
      document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }

    // 页面卸载时自动清理事件（可选）
    window.addEventListener('beforeunload', clearAllEvents);

  </script>
</body>

</html>
